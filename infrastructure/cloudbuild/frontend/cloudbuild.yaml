# Frontend pipeline (Cloud Run service `forsetiemblem-frontend`).
#
# Trigger: `forsetiemblem-frontend-trigger`
#   config file:    infrastructure/cloudbuild/frontend/cloudbuild.yaml
#   included files: frontend/**, infrastructure/cloudbuild/frontend/**
#
# Stages: validate -> build/push -> deploy.
#
# This file is independent of the backend pipeline: it declares no backend steps
# and no Secret Manager secrets, so a frontend build can never fail because of
# backend credentials, migrations, or database configuration.
#
# `NEXT_PUBLIC_*` values are public and inlined by Next.js at build time.

substitutions:
  _REGION: asia-northeast1
  _AR_REPO: forsetiemblem
  _FRONTEND_SERVICE: forsetiemblem-frontend

  # Build-time values (public, inlined by Next.js).
  _NEXT_PUBLIC_API_URL: https://fstemblm-be.rkvilena.com
  _NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  _NEXT_PUBLIC_CHAT_STORAGE_KEY: forsetiemblem-prod-chat-messages

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  # ---------------------------------------------------------------- validate ---
  - id: validate-frontend
    name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        cd frontend
        npm ci --no-audit --no-fund
        npm run type-check
        npm run lint

  # ------------------------------------------------------- build and publish ---
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${SHORT_SHA}"
        docker build \
          -f infrastructure/cloudbuild/frontend/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL="${_NEXT_PUBLIC_API_URL}" \
          --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}" \
          --build-arg NEXT_PUBLIC_CHAT_STORAGE_KEY="${_NEXT_PUBLIC_CHAT_STORAGE_KEY}" \
          -t "$image" \
          .
        docker push "$image"
        echo "$image" > /workspace/image.txt
    waitFor:
      - validate-frontend

  # ---------------------------------------------------------------- deploy ---
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # NEXT_PUBLIC_* values are inlined at build time, so no runtime env is needed.
        gcloud run deploy "${_FRONTEND_SERVICE}" \
          --image "$(cat /workspace/image.txt)" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated
    waitFor:
      - build-and-push

# Note: the image is pushed explicitly in `build-and-push`, so no `images:` block
# is needed here.
