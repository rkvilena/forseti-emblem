# Backend pipeline (Cloud Run service `forsetiemblem-backend`).
#
# Trigger: `forsetiemblem-backend-trigger`
#   config file:    infrastructure/cloudbuild/backend/cloudbuild.yaml
#   included files: backend/**, infrastructure/cloudbuild/backend/**
#
# Stages: validate -> test -> build/push -> migrate -> deploy.
#
# This file is independent of the frontend pipeline. A frontend change never
# runs a backend step and never resolves a backend secret.
#
# Secrets: Cloud Run reads its runtime secrets from Secret Manager via
# `--set-secrets`; Cloud Build reads only the two database URLs, and only in the
# steps that declare `secretEnv`. No secret value is stored in this file, in a
# trigger substitution, or in build output. Secret IDs are prefixed
# `<app>-<env>-` because project rkvilena hosts other applications.

substitutions:
  _REGION: asia-northeast1
  _AR_REPO: forsetiemblem
  _BACKEND_SERVICE: forsetiemblem-backend

  # Secret Manager IDs for backend runtime secrets. Names only -- never values.
  # The container still sees the plain variable names (DATABASE_URL, ...).
  _SECRET_DATABASE_URL: forsetiemblem-prod-database-url
  _SECRET_OPENAI_API_KEY: forsetiemblem-prod-openai-api-key
  _SECRET_REDIS_URL: forsetiemblem-prod-redis-url
  _SECRET_TURNSTILE_SECRET_KEY: forsetiemblem-prod-turnstile-secret-key
  _SECRET_DOCS_PASSWORD: forsetiemblem-prod-docs-password
  _SECRET_DOCS_SESSION_SECRET: forsetiemblem-prod-docs-session-secret

  # Runtime identity for Cloud Run. Empty keeps whatever the service uses today;
  # set it once `forsetiemblem-runtime@rkvilena.iam.gserviceaccount.com` exists.
  _RUNTIME_SERVICE_ACCOUNT: ""

  # Set to "false" to skip the Alembic step for a single build.
  _RUN_MIGRATIONS: "true"

  # Public backend configuration (not secrets).
  _ENVIRONMENT: production
  _CORS_ALLOWED_ORIGIN: https://forsetiemblem.rkvilena.com
  _OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  _OPENAI_CHAT_MODEL: gpt-4.1-mini
  _TURNSTILE_ENABLED: "true"
  _DOCS_AUTH_ENABLED: "true"
  _DOCS_AUTH_MODE: session
  _DOCS_USERNAME: ""
  _DOCS_SESSION_TTL_SECONDS: "180"
  _RATE_LIMIT_SHORT_WINDOW_SECONDS: "30"
  _RATE_LIMIT_SHORT_IP_REQUESTS: "3"
  _RATE_LIMIT_LONG_WINDOW_SECONDS: "86400"
  _RATE_LIMIT_LONG_IP_REQUESTS: "15"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s

steps:
  # ---------------------------------------------------------------- validate ---
  - id: validate-backend
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --disable-pip-version-check "ruff==0.6.8" "mypy==1.19.1"
        cd backend
        echo ":: ruff (blocking)"
        ruff check .
        # TODO: make blocking once the pre-existing type errors are fixed.
        # Currently 18 errors in 8 files (Column[str] vs str, Starlette middleware
        # signatures), so this stage is advisory to keep main deployable.
        echo ":: mypy (advisory)"
        mypy app || echo "WARNING: mypy reported errors (advisory, not failing the build)"

  # -------------------------------------------------------------------- test ---
  # The unit tests import `app.main` at collection time, and `app.db` builds the
  # SQLAlchemy engine during import, so DATABASE_URL must be present and
  # parseable. The engine is lazy and no test issues a query (the database
  # dependency is satisfied by a session that is never used), therefore no
  # connection is opened against this URL.
  - id: test-backend
    name: python:3.11-slim
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
    args:
      - -c
      - |
        set -euo pipefail
        cd backend
        pip install --quiet --disable-pip-version-check -r requirements.txt
        pytest -q

  # ------------------------------------------------------- build and publish ---
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}"
        docker build \
          -f infrastructure/cloudbuild/backend/Dockerfile \
          -t "$image" \
          .
        docker push "$image"
        echo "$image" > /workspace/image.txt
    waitFor:
      - validate-backend
      - test-backend

  # --------------------------------------------------------------- migrate ---
  # Runs Alembic against the direct (non-pooled) Supabase connection.
  # The URL arrives through availableSecrets, so it is never echoed and never
  # becomes a substitution. The image has no ENTRYPOINT, so the explicit command
  # replaces the server start-up and the app is not launched here.
  - id: migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - MIGRATION_DATABASE_URL
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_RUN_MIGRATIONS}" != "true" ]; then
          echo "migrations disabled (_RUN_MIGRATIONS=${_RUN_MIGRATIONS})"
          exit 0
        fi
        docker run --rm \
          -e DATABASE_URL="$${MIGRATION_DATABASE_URL}" \
          "$(cat /workspace/image.txt)" \
          bash -c "cd /code/backend && alembic -c alembic.ini upgrade head"
    waitFor:
      - build-and-push

  # ---------------------------------------------------------------- deploy ---
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Public config only. Anything sensitive is mounted from Secret Manager below.
        # The leading ^|^ selects "|" as the separator so URLs stay unambiguous.
        env_vars="^|^ENVIRONMENT=${_ENVIRONMENT}"
        env_vars="${env_vars}|CORS_ALLOWED_ORIGIN=${_CORS_ALLOWED_ORIGIN}"
        env_vars="${env_vars}|OPENAI_EMBEDDING_MODEL=${_OPENAI_EMBEDDING_MODEL}"
        env_vars="${env_vars}|OPENAI_CHAT_MODEL=${_OPENAI_CHAT_MODEL}"
        env_vars="${env_vars}|TURNSTILE_ENABLED=${_TURNSTILE_ENABLED}"
        env_vars="${env_vars}|DOCS_AUTH_ENABLED=${_DOCS_AUTH_ENABLED}"
        env_vars="${env_vars}|DOCS_AUTH_MODE=${_DOCS_AUTH_MODE}"
        env_vars="${env_vars}|DOCS_USERNAME=${_DOCS_USERNAME}"
        env_vars="${env_vars}|DOCS_SESSION_TTL_SECONDS=${_DOCS_SESSION_TTL_SECONDS}"
        env_vars="${env_vars}|RATE_LIMIT_SHORT_WINDOW_SECONDS=${_RATE_LIMIT_SHORT_WINDOW_SECONDS}"
        env_vars="${env_vars}|RATE_LIMIT_SHORT_IP_REQUESTS=${_RATE_LIMIT_SHORT_IP_REQUESTS}"
        env_vars="${env_vars}|RATE_LIMIT_LONG_WINDOW_SECONDS=${_RATE_LIMIT_LONG_WINDOW_SECONDS}"
        env_vars="${env_vars}|RATE_LIMIT_LONG_IP_REQUESTS=${_RATE_LIMIT_LONG_IP_REQUESTS}"

        secrets="^|^DATABASE_URL=${_SECRET_DATABASE_URL}:latest"
        secrets="${secrets}|OPENAI_API_KEY=${_SECRET_OPENAI_API_KEY}:latest"
        secrets="${secrets}|REDIS_URL=${_SECRET_REDIS_URL}:latest"
        secrets="${secrets}|TURNSTILE_SECRET_KEY=${_SECRET_TURNSTILE_SECRET_KEY}:latest"
        secrets="${secrets}|DOCS_PASSWORD=${_SECRET_DOCS_PASSWORD}:latest"
        secrets="${secrets}|DOCS_SESSION_SECRET=${_SECRET_DOCS_SESSION_SECRET}:latest"

        extra=()
        if [ -n "${_RUNTIME_SERVICE_ACCOUNT}" ]; then
          extra+=(--service-account "${_RUNTIME_SERVICE_ACCOUNT}")
        fi

        gcloud run deploy "${_BACKEND_SERVICE}" \
          --image "$(cat /workspace/image.txt)" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "${env_vars}" \
          --set-secrets "${secrets}" \
          ${extra[@]+"${extra[@]}"}
    waitFor:
      - migrate

# Only the two database URLs are exposed to the build, and only to the steps that
# declare `secretEnv`: `DATABASE_URL` for the unit-test stage (import-time engine
# creation) and `MIGRATION_DATABASE_URL` for Alembic. Cloud Run reads every other
# secret itself at runtime.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/forsetiemblem-prod-database-url/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/forsetiemblem-prod-migration-database-url/versions/latest
      env: MIGRATION_DATABASE_URL
